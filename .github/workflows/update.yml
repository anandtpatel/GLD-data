name: Update GLD prices

on:
  schedule:
    - cron: "17 22 * * 1-5"   # ~5:17 PM ET weekdays, after the close
    - cron: "37 12 * * 1-5"   # ~7:37 AM ET catch-up before the daily report
  workflow_dispatch:
  push:
    paths:
      - "update_gld.py"
      - "update_extras.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas openpyxl
      - run: python update_gld.py
        continue-on-error: true
      - run: python update_extras.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "gld-bot"
          git config user.email "gld-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add gld_10y.csv data/
          git diff --cached --quiet || git commit -m "GLD prices $(date -u +%F)"
          git push
